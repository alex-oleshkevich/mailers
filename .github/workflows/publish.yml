name: Upload Python Package

on:
    release:
        types: [created]

jobs:
    publish_package:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: astral-sh/setup-uv@v10.0.1
                with:
                    version: '0.11.30'
            -   name: Build
                run: uv build --no-sources
            -   name: Publish
                run: uv publish
