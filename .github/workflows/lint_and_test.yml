name: Lint and test

on:
    push:
    pull_request:

jobs:
    pre_commit:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: astral-sh/setup-uv@v8.3.2
                with:
                    version: '0.11.30'
                    python-version: '3.13'
                    enable-cache: true
            -   name: Run prek
                run: uvx --from prek==0.4.10 prek run --all-files

    unit_tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15' ]
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: astral-sh/setup-uv@v8.3.2
                with:
                    version: '0.11.30'
                    python-version: ${{ matrix.python-version }}
                    enable-cache: true
            -   name: Install dependencies
                run: uv sync --group dev --locked
            -   name: Test with pytest
                run: uv run pytest --no-cov-on-fail --cov mailers/ --cov tests/
